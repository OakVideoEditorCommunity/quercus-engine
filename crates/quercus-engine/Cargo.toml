[package]
name = "quercus-engine"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Quercus video engine: domain facade and the stable C ABI consumed by frontends"
readme = "README.md"
keywords = ["video", "editor", "media", "ffmpeg", "c-abi"]
categories = ["multimedia::video", "api-bindings"]
include = ["src/**/*.rs", "include/**/*.h", "README.md", "LICENSE", "Cargo.toml", "build.rs"]

[package.metadata.docs.rs]
no-default-features = true
features = ["docs-only"]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["native"]
native = ["dep:serde", "dep:serde_json", "dep:libc", "dep:quercus-audio", "dep:quercus-codec", "dep:quercus-core", "dep:quercus-ffmpeg-link", "dep:quercus-node", "dep:quercus-ofx-plugin", "dep:quercus-otio", "dep:quercus-render", "dep:quercus-storage", "dep:quercus-task", "dep:quercus-timeline", "dep:quercus-undo"]
# docs.rs builds an empty, dependency-free crate page: the real interface is
# the C ABI in include/quercus_engine.h and the SDK documentation.
docs-only = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
quercus-audio = { version = "=0.5.2", path = "../quercus-audio", optional = true }
quercus-codec = { version = "=0.5.2", path = "../quercus-codec", optional = true }
quercus-core = { version = "=0.5.2", path = "../quercus-core", optional = true }
quercus-ffmpeg-link = { version = "=0.5.2", path = "../quercus-ffmpeg-link", optional = true }
quercus-node = { version = "=0.5.2", path = "../quercus-node", optional = true }
quercus-ofx-plugin = { version = "=0.5.2", path = "../quercus-ofx-plugin", optional = true }
quercus-otio = { version = "=0.5.2", path = "../quercus-otio", optional = true }
quercus-render = { version = "=0.5.2", path = "../quercus-render", optional = true }
quercus-storage = { version = "=0.5.2", path = "../quercus-storage", optional = true }
quercus-task = { version = "=0.5.2", path = "../quercus-task", optional = true }
quercus-timeline = { version = "=0.5.2", path = "../quercus-timeline", optional = true }
quercus-undo = { version = "=0.5.2", path = "../quercus-undo", optional = true }
