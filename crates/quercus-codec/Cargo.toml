[package]
name = "quercus-codec"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor media codec module (Rust) (internal; do not depend directly)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
ffmpeg-static = ["ffmpeg-next/static"]

[dependencies]
quercus-core = { version = "=0.7.1", path = "../quercus-core" }
# Real media decode/encode. The C++ ffmpeg_bridge library existed only to
# absorb FFmpeg API churn; the Rust crate calls ffmpeg-next directly.
#
# ffmpeg-next uses the development prefix supplied through FFMPEG_DIR.
# Dynamic linking is the default; ffmpeg-static opts into static archives.
ffmpeg-next = "9.0.0"
# `std::error::Error` impls for the crate-internal error enum.
thiserror = "2"
# Maintained SubRip parser/serializer. quercus-codec decodes the byte stream
# itself (UTF-8/UTF-16 BOM) before handing text to the crate.
subparse = "0.7"

# M5 zero-copy import: the D3D11VA COM side (shared NT handle creation
# from the decoder's ID3D11Texture2D). Same `windows` generation as
# wgpu-hal 29 so the Foundation/DXGI types unify.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Com",
] }

[target.'cfg(not(windows))'.dependencies]
quercus-ffmpeg-link = { version = "=0.7.1", path = "../quercus-ffmpeg-link" }
