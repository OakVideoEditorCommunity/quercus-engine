[package]
name = "quercus-render"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor render engine (Rust)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
quercus-core = { version = "=0.5.2", path = "../quercus-core" }
# Direct Rust calls (single-lib unification): the decode bridge calls
# quercuscodec's ffi, the node bridge calls quercusnode's ffi. Both directions
# are acyclic (quercuscodec → quercuscore-rs/quercus-ffmpeg-link; quercusnode → quercuscodec).
quercus-codec = { version = "=0.5.2", path = "../quercus-codec" }
quercus-node = { version = "=0.5.2", path = "../quercus-node" }
# wgpu: portable GPU backend (Metal/Vulkan/GL/DX12 in one safe API) — the
# direct replacement for the C++ libquercusgl2/libquercusvulkan backend plugins.
# Version 29 matches gpui_wgpu's device (M2 zero-copy present).
wgpu = "29"
# naga: GLSL → WGSL translation for the node shaders (the embedded GLSL
# stays the single source of truth, matching the C++ Vulkan backend's
# mechanical-conversion approach). Pinned to wgpu 29's naga generation;
# only the GLSL frontend and WGSL writer are compiled.
naga = { version = "29", default-features = false, features = ["glsl-in", "wgsl-out"] }
# ocio-rs: safe Rust bindings for OpenColorIO v2.5.2 — the ColorProcessor
# implementation; OCIO is never rewritten. The `bundled` feature compiles
# the vendored OpenColorIO C++ sources (cmake/ninja required); without it
# ocio-sys builds a stub (all color tests then early-return).
ocio-rs = { version = "0.2", features = ["bundled"] }
# `std::error::Error` impls for the crate-internal error enum.
thiserror = "2"
# The text layout/raster engine installed into quercus-node's textbackend
# hooks (src/textengine.rs) — shared by the app and the worker pool, so
# both sides pin the same version as gpui's text system (one cosmic-text
# in the lockfile).
cosmic-text = "=0.19.0"
# M15 S1: physical-memory query for the process-pool worker-count policy
# (sysctlbyname on macOS / sysconf on Linux) in src/procpool.rs.
libc = "0.2"
# M15 S1: the render-worker NDJSON control protocol (src/ipc.rs moved here
# from quercus-worker so both ends of the pipe link one copy; src/procpool.rs
# is the main-process side).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cache identity UUIDs (src/cache.rs): v4 generation and the canonical
# braced text form replace the hand-rolled xorshift RNG + hex formatting.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# quercuscodec is also a plain dependency above; the dev-dependency re-entry
# used to enable quercuscodec's `test-stubs` host-mocks, which no longer exist
# (single-lib unification removed the quercuscore_audioparams_* C ABI calls).
