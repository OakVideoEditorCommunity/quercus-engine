[package]
name = "quercus-ofx-plugin"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor plugin module: self-contained OFX host and plugin bridge (Rust) (internal; do not depend directly)"
license = "GPL-3.0-or-later"

# staticlib: linked into libquercusplugin by CMake (see M11 §3.3).
# cdylib is NOT used: the module dylib stays a CMake target so the
# standalone-tree wiring (rpath, force_load, tests) is unchanged.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# 共享 ABI 类型（CHandle 等，单库化统一，见 docs/zh/plans/riir/single-lib.md）。
# 模块桥改直接 Rust 调用（单库化，见 docs/zh/plans/riir/single-lib.md）；
# 只允许零依赖起步。确需引入的 crate 必须在 README 登记理由。
quercus-core = { version = "=0.5.2", path = "../quercus-core" }
quercus-undo = { version = "=0.5.2", path = "../quercus-undo" }
quercus-node = { version = "=0.5.2", path = "../quercus-node" }
quercus-render = { version = "=0.5.2", path = "../quercus-render" }
# Error derive（Display + std::error::Error，见 src/error.rs）；理由已登记 README。
thiserror = "2"

[features]
# 历史 feature（原桥测试桩开关）：单库化后 quercusnode/quercusrender/quercusundo
# 以 path 依赖直连，句柄式调用面改为本地桩（见 src/node.rs /
# src/render.rs 的 `// STUB` 标记），本 feature 无 cfg 使用点——
# 保留以避免工作区/构建脚本 `--features test-stubs` 断裂。
test-stubs = []

[build-dependencies]
# C shim 编译（message suite 的 variadic 入口）；理由已登记 README。
cc = "1"
