[package]
name = "quercus-ofx-plugin"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor plugin module: self-contained OFX host and plugin bridge (Rust) (internal; do not depend directly)"
license = "GPL-3.0-or-later"

# staticlib: linked into libquercusplugin by CMake (see M11 §3.3).
# cdylib is NOT used: the module dylib stays a CMake target so the
# standalone-tree wiring (rpath, force_load, tests) is unchanged.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Shared ABI types (CHandle etc., unified by the single-library consolidation; see docs/zh/plans/riir/single-lib.md).
# The module bridge now uses direct Rust calls (single-library consolidation; see docs/zh/plans/riir/single-lib.md);
# start from zero dependencies only. Any crate that really must be added has to be registered with its reason in the README.
quercus-core = { version = "=0.7.2", path = "../quercus-core" }
quercus-undo = { version = "=0.7.2", path = "../quercus-undo" }
quercus-node = { version = "=0.7.2", path = "../quercus-node" }
quercus-render = { version = "=0.7.2", path = "../quercus-render" }
# Error derive (Display + std::error::Error, see src/error.rs); the rationale is registered in the README.
thiserror = "2"

# Linux OpenFX GL zero-copy: EGL/GL are loaded dynamically so the crate
# still builds on hosts without libEGL/libGL.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
libc = "0.2"

# Windows OpenFX GL zero-copy: WGL context + GL_EXT_memory_object_win32.
# windows-sys provides the hidden-window/GDI/WGL bindings without pulling
# in the full windows crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Legacy feature (formerly the bridge test-stub switch): after the single-library
# consolidation quercusnode/quercusrender/quercusundo are direct path dependencies and
# the handle-style call surface became local stubs (see the `// STUB` markers in
# src/node.rs / src/render.rs); this feature has no cfg use sites — kept so that
# workspace/build-script `--features test-stubs` does not break.
test-stubs = []

[build-dependencies]
# C shim compilation (the message suite's variadic entry points); the rationale is registered in the README.
cc = "1"
