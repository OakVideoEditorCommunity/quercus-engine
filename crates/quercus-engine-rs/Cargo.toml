[package]
name = "quercus-engine-rs"
edition = "2024"
version = "0.7.1"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Safe Rust SDK for the Quercus video engine: editor sessions, semantic edits, preview, media and OFX"
readme = "README.md"
keywords = ["video", "editor", "media", "nle", "ffmpeg"]
categories = ["multimedia::video", "api-bindings"]
include = ["src/**/*.rs", "README.md", "LICENSE", "Cargo.toml", "build.rs"]

[package.metadata.docs.rs]
# docs.rs cannot build the native engine (static FFmpeg/OpenColorIO). The SDK
# itself is pure Rust: its public surface is the extern declarations and
# wrappers, which rustdoc can document without linking the dylib.
no-default-features = true

[lib]
crate-type = ["rlib"]

[features]
default = ["engine-rlib"]
ffmpeg-static = ["quercus-engine/ffmpeg-static"]
# Prefer Cargo's normal rlib linkage; opt into the standalone C ABI dylib
# only when the application explicitly packages libquercus_engine.
engine-rlib = ["dep:quercus-engine", "quercus-engine/native"]
engine-cdylib = ["dep:quercus-engine", "dep:quercus-engine-cdylib", "quercus-engine/native", "quercus-engine-cdylib/native"]

[dependencies]
thiserror = "2"
# The engine is a cdylib which the SDK links dynamically (`#[link]`) and
# talks to only through its exported `extern "C"` symbols — no Rust API
# of the engine is used. The dependency edge makes cargo build the dylib
# into the dependency search path before anything links the SDK.
quercus-engine = { version = "=0.7.1", path = "../quercus-engine", optional = true, default-features = false }

[target.'cfg(not(windows))'.build-dependencies]
# Build-dependency edge: forces the engine cdylib to exist before this
# crate's build script runs (normal dependencies are not guaranteed to be
# built before the dependent's build script). Same optional feature.
# Windows is excluded: Cargo already produces an unhashed
# quercus_engine.dll in deps, and a host build of the cdylib would collide
# with the target link (LNK1104).
quercus-engine-cdylib = { package = "quercus-engine", version = "=0.7.1", path = "../quercus-engine", optional = true, default-features = false }
