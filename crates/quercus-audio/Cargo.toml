[package]
name = "quercus-audio"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor audio I/O, processing, synchronization and waveform engine (Rust) (internal; do not depend directly)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
quercus-ffmpeg-link = { version = "=0.5.2", path = "../quercus-ffmpeg-link" }
quercus-core = { version = "=0.5.2", path = "../quercus-core" }
quercus-codec = { version = "=0.5.2", path = "../quercus-codec" }
# Real resample/channel-convert/time-stretch filter graph. The C++
# ffmpeg_bridge library existed only to absorb FFmpeg API churn; the Rust
# crate calls ffmpeg-next directly (same as quercuscodec). The quercus-ffmpeg-link
# dependency above emits the transitive link flags of the static FFmpeg.
ffmpeg-next = "9"

# ASIO is intentionally not enabled: the asio-sys crate needs the proprietary
# Steinberg ASIO SDK at link time, which CI and most dev machines do not have.
# WASAPI (the default Windows backend) covers Windows on its own.
cpal = {version = "0.18", features = ["pulseaudio", "pipewire", "jack"]}
# `std::error::Error` impls for the crate-internal error enum.
thiserror = "2"
