[package]
name = "quercus-timeline"
version.workspace = true
edition = "2021"
description = "Quercus Video Editor timeline edit primitives (Rust) (internal; do not depend directly)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
quercus-core = { version = "=0.5.2", path = "../quercus-core" }
quercus-undo = { version = "=0.5.2", path = "../quercus-undo" }
quercus-node = { version = "=0.5.2", path = "../quercus-node" }
# Error trait derive for the crate-internal error enum.
thiserror = "2"
